name: CI

on:
  push:
    branches: [main, 'redesign/**', 'codex/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, lint, types, unit tests, data, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - name: Verify research data and asset checksums
        run: npm run verify:data
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          include-hidden-files: true
          retention-days: 1

  e2e:
    name: End-to-end (Chromium, software WebGL)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAYWRIGHT_CHANNEL: ''
      PLAYWRIGHT_SOFTWARE_GL: '1'
      PLAYWRIGHT_EXPECT_TIMEOUT: '45000'
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3101
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next
      - run: npx playwright install --with-deps chromium
      - name: Start production server
        run: |
          npx next start -p 3101 &
          npx --yes wait-on http://127.0.0.1:3101 --timeout 60000
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
